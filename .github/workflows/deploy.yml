# Publishes the site to GitHub Pages and to its assets-only Cloudflare Worker,
# through spec's shared `site-deploy`, which writes the worker's configuration
# from the inputs below; `wrangler.jsonc` is the same configuration for a local
# `wrangler dev`. A sibling repository asks for a rebuild through
# `rebuild-site`, which this answers.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The sibling repositories ask for a rebuild through `rebuild-site` in the spec
  # repository, whose `site` input exists so a second site can call it rather
  # than copy it. Without this trigger that input is a promise this repository
  # cannot keep: `POST /dispatches` answers 204 whether or not anything is
  # listening, so a dispatch aimed here would be accepted and do nothing.
  #
  # A rebuild renders the revisions this repository already pins, so it
  # republishes rather than refreshes — which is the whole design (ADR-0015).
  # Fresh content comes from advancing a pin, and that is a push to `main`.
  repository_dispatch:
    types: [rebuild-site]

# Nothing by default, rather than nothing written down: an absent `permissions`
# key falls back to the repository's setting, which can be wider than this. Each
# job below asks for exactly what it needs, so neither holds the other's.
permissions: {}

# One deploy at a time, and a deploy already running is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: lemonfiber/spec/.github/workflows/site-deploy.yml@f2e2e10e62eb207d07cce8f3d9deb1336ad53e5f # v1.0.121
    with:
      worker: website-contribute
      compatibility-date: "2026-10-09"
      submodules: true
      build: |
        npm run messages
        npm run build
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
