# The addresses this site sends a reader to, fetched over the built site on a
# schedule, through spec's shared `site-links` (REPO-R71). It reports, and
# gates nothing.
name: links

on:
  workflow_dispatch:
  schedule:
    # Daily, off the hour.
    - cron: "25 5 * * *"

permissions:
  contents: read

jobs:
  links:
    uses: lemonfiber/spec/.github/workflows/site-links.yml@1cbf3e262ca3cb3cd5afe227f36bbe98ff929895 # v1.0.139
    with:
      requirement: REPO-R71
      timeout-minutes: 30
