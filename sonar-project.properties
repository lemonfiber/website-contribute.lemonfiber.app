# Read by the SonarQube Cloud scan `sonar.yml` runs, which analyses this tree.
sonar.projectKey=lemonfiber_website-contribute.lemonfiber.app
sonar.organization=lemonfiber

# `vendor/` is the submodules: other repositories, pinned and rendered here and
# never edited here, so a finding in one belongs to the repository that owns it.
# `src/content/` is the collection they enter by symlink, and prose on either
# side of that. `src/paraglide/` is generated by `npm run messages` and
# rewritten whole on every run, so a finding there cannot be fixed where it is
# reported. `scripts/no_open_codeql_alert.py` is the spec's shared gate,
# byte-identical to its home copy and analysed there.
sonar.exclusions=src/paraglide/**,src/content/**,vendor/**,dist/**,.astro/**,scripts/no_open_codeql_alert.py

sonar.sourceEncoding=UTF-8

# This site has no suite: its code is configuration and five calls into
# website-kit, whose rules are covered there. The gate here is the guards, the
# build, the link check and the accessibility sweep, so no line is measured for
# coverage.
sonar.coverage.exclusions=**/*
